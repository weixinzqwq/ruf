function element(tag,text,className){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(className)node.className=className;return node;}
function reconcile(parent,children){children.forEach((node,i)=>{if(parent.children[i]!==node)parent.insertBefore(node,parent.children[i]||null);});while(parent.children.length>children.length)parent.removeChild(parent.lastElementChild);}
function walk(value,visit,enabled=true){if(Array.isArray(value)){value.forEach(child=>walk(child,visit,enabled));return;}if(!value||typeof value!=='object')return;const active=enabled&&value.enabled!==false&&value.visible!==false;visit(value,active);for(const key of Object.keys(value))if(key!=='values')walk(value[key],visit,active);}

function indexDocument(){targets.clear();function index(value,parents=[],section=false){if(Array.isArray(value)){value.forEach(v=>index(v,parents,section));return;}if(!value||typeof value!=='object')return;
 const next=parents.concat(value);if(value.id&&(value.type||section))targets.set(value.id,{node:value,parents:next});
 for(const key of Object.keys(value))if(!['values','columns','rows'].includes(key)&&!(value.type==='catalog'&&key==='items'))index(value[key],next,key==='sections');}index(panelDocument);indexedDocument=panelDocument;pruneCaches();}

 }
